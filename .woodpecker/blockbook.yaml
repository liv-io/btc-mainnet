when:
  - path:
      include:
        - '.woodpecker/blockbook.yaml'
        - 'apps/blockbook/**'

clone:
  - name: git
    image: woodpeckerci/plugin-git
    volumes:
      - custom-ca-certs:/etc/ssl/certs/custom:ro
    settings:
      custom_ssl_path: /etc/ssl/certs/custom/ca1.liv.io.crt

steps:
  - name: lint
    image: code.liv.io/liv/k8s-ops:1.37.1-1
    environment:
      KUBECONFIG_DATA:
        from_secret: blockbook-deployer
      RPC_PASS:
        from_secret: blockbook_rpc_pass
      SSH_KEY:
        from_secret: code_container_ssh
    commands:
      - /cmd.sh

      - install --directory --owner=k8s --group=k8s --mode=0700 ~/.ssh
      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.ssh/id_ed25519
      - echo "$${SSH_KEY}" > ~/.ssh/id_ed25519
      - export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"

      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.kubeconfig
      - echo "$${KUBECONFIG_DATA}" > ~/.kubeconfig
      - export KUBECONFIG=~/.kubeconfig

      - >-
        kubectl create secret generic blockbook-secrets
        --namespace=blockbook
        --from-literal=RPC_PASS="$${RPC_PASS}"
        --dry-run=client -o yaml | kubectl apply --dry-run=client -f -

      - kubectl apply -k ./apps/blockbook/ --dry-run=client
      - kubectl apply -k ./apps/blockbook/ --dry-run=server

  - name: deploy
    image: code.liv.io/liv/k8s-ops:1.37.1-1
    environment:
      KUBECONFIG_DATA:
        from_secret: blockbook-deployer
      RPC_PASS:
        from_secret: blockbook_rpc_pass
      SSH_KEY:
        from_secret: code_container_ssh
    when:
      - event: push
        branch: main
    commands:
      - /cmd.sh

      - install --directory --owner=k8s --group=k8s --mode=0700 ~/.ssh
      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.ssh/id_ed25519
      - echo "$${SSH_KEY}" > ~/.ssh/id_ed25519
      - export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"

      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.kubeconfig
      - echo "$${KUBECONFIG_DATA}" > ~/.kubeconfig
      - export KUBECONFIG=~/.kubeconfig

      - >-
        kubectl create secret generic blockbook-secrets
        --namespace=blockbook
        --from-literal=RPC_PASS="$${RPC_PASS}"
        --dry-run=client -o yaml | kubectl apply -f -

      - kubectl apply -k ./apps/blockbook/
      - kubectl rollout status -n blockbook deployment/blockbook --timeout=90s
      - kubectl get deployment blockbook -n blockbook -o jsonpath='{.spec.template.spec.containers[*].image}'

labels:
  platform: linux/amd64
