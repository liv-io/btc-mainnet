apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: btcd
nameSuffix: -latest

images:
  - name: btcd
    newName: code.liv.io/liv/btcd
    newTag: 0.27.0-1

patches:
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: db
      spec:
        resources:
          requests:
            storage: 2000Gi

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: btcd
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: code.liv.io
            containers:
              - name: btcd
                env:
                  - name: ADDPEER
                    value: "10.1.13.221:8333 10.1.13.222:8333"
                  - name: EXTERNALIP
                    value: "213.193.83.253"

  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: int
      spec:
        externalIPs:
          - 10.1.13.223

  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: ext
      spec:
        externalIPs:
          - 10.1.13.223
