apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: btc
nameSuffix: -stable

commonLabels:
  instance: stable

resources:
  - ../../base

images:
  - name: registry.liv.io/liv/bitcoin-core
    newTag: 27.2-1

patches:
  - target:
      kind: Service
      name: btc
    patch: |-
      - op: add
        path: /spec/externalIPs
        value:
          - 10.1.13.222

  - target:
      kind: Service
      name: btc-external
    patch: |-
      - op: add
        path: /spec/externalIPs
        value:
          - 10.1.13.222

  - target:
      kind: Deployment
      name: btc
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ADDNODE
          value: "10.1.13.221:8333 10.1.13.223:8333"
