apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: bitcoin-core
nameSuffix: -stable

labels:
  - pairs:
      app.kubernetes.io/instance: stable
    includeSelectors: true

images:
  - name: bitcoin-core
    newName: code.liv.io/liv/bitcoin-core
    newTag: 27.2-1

patches:
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: db
      spec:
        resources:
          requests:
            storage: 2000Gi

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: bitcoin-core
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: code.liv.io
            containers:
              - name: bitcoin-core
                env:
                  - name: ADDNODE
                    value: "10.1.13.221:8333 10.1.13.223:8333"

  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: int
      spec:
        externalIPs:
          - 10.1.13.222

  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: ext
      spec:
        externalIPs:
          - 10.1.13.222
