apiVersion: v1
kind: ServiceAccount

metadata:
  name: btcd-deployer
  namespace: btcd

---

apiVersion: v1
kind: Secret

metadata:
  name: btcd-deployer-token
  namespace: btcd
  annotations:
    kubernetes.io/service-account.name: btcd-deployer

type: kubernetes.io/service-account-token

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: btcd-deployer-binding
  namespace: btcd

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin

subjects:
  - kind: ServiceAccount
    name: btcd-deployer
    namespace: btcd
